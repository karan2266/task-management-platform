server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tmpdb?currentSchema=authdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: authdb

  flyway:
    enabled: true
    schemas: authdb
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false   # serialize Instant as ISO-8601 string

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # default: 24 hours

  admin:
    email:     ${ADMIN_EMAIL:admin@example.com}
    password:  ${ADMIN_PASSWORD}
    full-name: ${ADMIN_FULL_NAME:Platform Admin}
